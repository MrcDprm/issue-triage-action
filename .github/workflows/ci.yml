# Her push ve PR'da: tür kontrolü, lint, testler ve paket. Repodaki dist/ kaynakla aynı değilse kırmızı olur,
# çünkü Action'ı kullananlar derleme yapmadan doğrudan dist/index.js'i çalıştırır.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: dist/ is up to date
        run: |
          if ! git diff --exit-code -- dist/; then
            echo "::error::dist/ is stale. Run npm run build and commit it."
            exit 1
          fi
