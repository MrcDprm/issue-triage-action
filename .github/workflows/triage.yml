# Bu repo kendi issue'larını kendi Action'ıyla sınıflandırır (uses: ./): README'deki örneğin canlı hâli.
name: Issue triage

on:
  issues:
    types: [opened, edited, reopened]

# En az yetki: issue'ya etiket ve yorum yazmak için issues: write, kodu çekmek için contents: read.
permissions:
  contents: read
  issues: write

# Aynı issue art arda düzenlenirse çalıştırmalar sırayla gider; iki yorum ya da çakışan etiket oluşmaz.
concurrency:
  group: triage-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./
        with:
          api-key: ${{ secrets.GEMINI_API_KEY }}
